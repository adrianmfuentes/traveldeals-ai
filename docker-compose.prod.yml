# =============================================================================
# TravelDeals AI — Production (self-hosted Postgres + Redis)
# Usage: docker compose -f docker-compose.prod.yml --env-file .env up -d
# =============================================================================

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: traveldeals
      POSTGRES_USER: ${POSTGRES_USER:-traveldeals}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traveldeals}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Redis (BullMQ queue) ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - internal

  # ── DB migrations (runs once on startup) ──────────────────────────────────
  migrate:
    image: ghcr.io/adrianmfuentes/traveldeals-ai/migrate:latest
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-traveldeals}:${POSTGRES_PASSWORD}@postgres:5432/traveldeals
      DIRECT_URL:   postgresql://${POSTGRES_USER:-traveldeals}:${POSTGRES_PASSWORD}@postgres:5432/traveldeals
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: on-failure

  # ── Next.js app ─────────────────────────────────────────────────────────────
  app:
    image: ghcr.io/adrianmfuentes/traveldeals-ai/app:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL:        postgresql://${POSTGRES_USER:-traveldeals}:${POSTGRES_PASSWORD}@postgres:5432/traveldeals
      DIRECT_URL:          postgresql://${POSTGRES_USER:-traveldeals}:${POSTGRES_PASSWORD}@postgres:5432/traveldeals
      REDIS_URL:           redis://redis:6379
      NEXTAUTH_SECRET:     ${NEXTAUTH_SECRET}
      NEXTAUTH_URL:        ${NEXTAUTH_URL}
      GROQ_API_KEY:        ${GROQ_API_KEY}
      SERPAPI_API_KEY:     ${SERPAPI_API_KEY}
      RESEND_API_KEY:      ${RESEND_API_KEY:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - internal
      - nginx-proxy-manager_default

  # ── Background worker ────────────────────────────────────────────────────────
  worker:
    image: ghcr.io/adrianmfuentes/traveldeals-ai/worker:latest
    restart: unless-stopped
    environment:
      NODE_ENV:        production
      DATABASE_URL:    postgresql://${POSTGRES_USER:-traveldeals}:${POSTGRES_PASSWORD}@postgres:5432/traveldeals
      DIRECT_URL:      postgresql://${POSTGRES_USER:-traveldeals}:${POSTGRES_PASSWORD}@postgres:5432/traveldeals
      REDIS_URL:       redis://redis:6379
      GROQ_API_KEY:    ${GROQ_API_KEY}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY}
      RESEND_API_KEY:  ${RESEND_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - internal

volumes:
  postgres-data:
  redis-data:

networks:
  internal:
    driver: bridge
  nginx-proxy-manager_default:
    external: true
