# =============================================================================
# TravelDeals AI — Production (NeonDB + Upstash Redis, no local infra)
# Usage: docker compose -f docker-compose.prod.yml --env-file .env up -d
# =============================================================================

services:

  # ── DB migrations (runs once on startup) ──────────────────────────────────
  migrate:
    image: ghcr.io/adrianmfuentes/traveldeals-ai/app:latest
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL:   ${DIRECT_URL}
    restart: on-failure

  # ── Next.js app ─────────────────────────────────────────────────────────────
  app:
    image: ghcr.io/adrianmfuentes/traveldeals-ai/app:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL:        ${DATABASE_URL}
      DIRECT_URL:          ${DIRECT_URL}
      REDIS_URL:           ${REDIS_URL}
      NEXTAUTH_SECRET:     ${NEXTAUTH_SECRET}
      NEXTAUTH_URL:        ${NEXTAUTH_URL}
      GROQ_API_KEY:        ${GROQ_API_KEY}
      SERPAPI_API_KEY:     ${SERPAPI_API_KEY}
      RESEND_API_KEY:      ${RESEND_API_KEY:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - nginx-proxy-manager_default

  # ── Background worker ────────────────────────────────────────────────────────
  worker:
    image: ghcr.io/adrianmfuentes/traveldeals-ai/worker:latest
    restart: unless-stopped
    environment:
      NODE_ENV:        production
      DATABASE_URL:    ${DATABASE_URL}
      DIRECT_URL:      ${DIRECT_URL}
      REDIS_URL:       ${REDIS_URL}
      GROQ_API_KEY:    ${GROQ_API_KEY}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY}
      RESEND_API_KEY:  ${RESEND_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - nginx-proxy-manager_default

networks:
  nginx-proxy-manager_default:
    external: true
