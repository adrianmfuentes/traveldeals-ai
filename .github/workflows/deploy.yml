name: Deploy to Oracle Ampere

on:
  workflow_run:
    workflows: ["Build & Push Docker Images"]
    branches: [master]
    types: [completed]
  workflow_dispatch:
    inputs:
      clean_volumes:
        description: 'Delete ALL data volumes (postgres + redis). DESTRUCTIVE — irreversible.'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  DEPLOY_DIR: traveldeals-ai
  SSH_PORT: "4422"

jobs:
  deploy:
    name: Deploy to Server
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-traveldeals
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # ── WireGuard ─────────────────────────────────────────────────────────
      # El túnel se levanta ANTES que cualquier intento SSH. El despliegue
      # habla con el servidor por su IP privada de WireGuard, de modo que el
      # tráfico SSH nunca toca la IP pública vigilada por CrowdSec (ssh-bf).
      - name: Establish WireGuard tunnel
        env:
          WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
          WG_SERVER_PUBKEY: ${{ secrets.WG_SERVER_PUBKEY }}
          WG_ENDPOINT: ${{ secrets.WG_ENDPOINT }}
          WG_SERVER_IP: ${{ secrets.WG_SERVER_IP }}
          WG_CLIENT_ADDRESS: ${{ vars.WG_CLIENT_ADDRESS || '10.10.0.2/32' }}
        run: |
          set -euo pipefail
          for v in WG_PRIVATE_KEY WG_SERVER_PUBKEY WG_ENDPOINT WG_SERVER_IP; do
            if [ -z "${!v}" ]; then
              echo "ERROR: falta el secret $v en el entorno 'production'."
              exit 1
            fi
          done
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq wireguard-tools
          umask 077
          tmp="$(mktemp)"
          {
            echo "[Interface]"
            echo "PrivateKey = ${WG_PRIVATE_KEY}"
            echo "Address = ${WG_CLIENT_ADDRESS}"
            echo
            echo "[Peer]"
            echo "PublicKey = ${WG_SERVER_PUBKEY}"
            echo "Endpoint = ${WG_ENDPOINT}"
            echo "AllowedIPs = ${WG_SERVER_IP}/32"
            echo "PersistentKeepalive = 25"
          } > "$tmp"
          sudo install -m 600 "$tmp" /etc/wireguard/wg0.conf
          rm -f "$tmp"
          sudo wg-quick up wg0
          for _ in $(seq 1 10); do
            if ping -c 1 -W 2 "$WG_SERVER_IP" >/dev/null 2>&1; then
              echo "WireGuard OK: $WG_SERVER_IP alcanzable"
              exit 0
            fi
            sleep 2
          done
          echo "AVISO: sin respuesta ICMP de $WG_SERVER_IP (puede estar filtrado); se continúa."

      # ── SSH ───────────────────────────────────────────────────────────────
      # known_hosts se escribe desde un secret (SERVER_SSH_KNOWN_HOSTS): no se
      # ejecuta ssh-keyscan y StrictHostKeyChecking sigue en 'yes'. Todas las
      # conexiones SSH del job se multiplexan sobre un único socket maestro.
      - name: Configure SSH (single multiplexed connection)
        env:
          SERVER_USER: ${{ secrets.SERVER_USER || vars.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
          WG_SERVER_IP: ${{ secrets.WG_SERVER_IP }}
        run: |
          set -euo pipefail
          for v in SERVER_USER SERVER_SSH_KEY SERVER_SSH_KNOWN_HOSTS WG_SERVER_IP; do
            if [ -z "${!v}" ]; then
              echo "ERROR: falta el secret/var $v en el entorno 'production'."
              exit 1
            fi
          done
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SERVER_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          {
            echo "Host deploy-target"
            echo "  HostName $WG_SERVER_IP"
            echo "  User $SERVER_USER"
            echo "  Port $SSH_PORT"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
            echo "  ControlMaster auto"
            echo "  ControlPath ~/.ssh/cm-%r@%h:%p"
            echo "  ControlPersist 300s"
            echo "  ConnectTimeout 30"
            echo "  ServerAliveInterval 15"
            echo "  ServerAliveCountMax 4"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      # Único evento de autenticación SSH de todo el despliegue. El resto de
      # pasos reutilizan este socket maestro (no hay re-autenticación).
      - name: Open master SSH connection
        run: |
          set -euo pipefail
          retry() {
            local -a delays=(5 15 30)
            local attempt=1
            until "$@"; do
              if [ "$attempt" -gt "${#delays[@]}" ]; then
                echo "retry: fallo tras $((attempt - 1)) reintentos" >&2
                return 1
              fi
              d="${delays[$((attempt - 1))]}"
              echo "retry: intento $attempt fallido; reintento en ${d}s" >&2
              sleep "$d"
              attempt=$((attempt + 1))
            done
          }
          retry ssh -Nf deploy-target
          ssh -O check deploy-target

      - name: Prepare deployment bundle
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || vars.POSTGRES_PASSWORD }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || vars.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || vars.NEXTAUTH_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || vars.GROQ_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY || vars.SERPAPI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || vars.RESEND_API_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || vars.NEXT_PUBLIC_APP_URL }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLEAN_VOLUMES: ${{ inputs.clean_volumes }}
        run: |
          set -euo pipefail
          for name in POSTGRES_USER POSTGRES_PASSWORD NEXTAUTH_SECRET NEXTAUTH_URL \
                      GROQ_API_KEY SERPAPI_API_KEY NEXT_PUBLIC_APP_URL; do
            if [ -z "${!name}" ]; then
              echo "ERROR: $name no está definido en el entorno 'production'."
              exit 1
            fi
          done
          # Docker Compose interpola ${VAR} en los valores del .env, así que un
          # '$' literal en un secreto (p. ej. una contraseña) se escribe '$$'.
          esc() { printf '%s' "$1" | sed 's/[$]/$$/g'; }
          rm -rf stage
          mkdir -p stage
          cp docker-compose.prod.yml stage/docker-compose.yml
          cp deploy/remote-deploy.sh stage/remote-deploy.sh
          chmod +x stage/remote-deploy.sh
          {
            printf 'POSTGRES_USER=%s\n'       "$(esc "$POSTGRES_USER")"
            printf 'POSTGRES_PASSWORD=%s\n'   "$(esc "$POSTGRES_PASSWORD")"
            printf 'NEXTAUTH_SECRET=%s\n'     "$(esc "$NEXTAUTH_SECRET")"
            printf 'NEXTAUTH_URL=%s\n'        "$(esc "$NEXTAUTH_URL")"
            printf 'GROQ_API_KEY=%s\n'        "$(esc "$GROQ_API_KEY")"
            printf 'SERPAPI_API_KEY=%s\n'     "$(esc "$SERPAPI_API_KEY")"
            printf 'RESEND_API_KEY=%s\n'      "$(esc "${RESEND_API_KEY:-}")"
            printf 'NEXT_PUBLIC_APP_URL=%s\n' "$(esc "$NEXT_PUBLIC_APP_URL")"
          } > stage/.env
          {
            printf 'REGISTRY=%s\n'      "$REGISTRY"
            printf 'GHCR_USER=%s\n'     "$GHCR_USER"
            printf 'GHCR_TOKEN=%s\n'    "$GHCR_TOKEN"
            printf 'CLEAN_VOLUMES=%s\n' "${CLEAN_VOLUMES:-false}"
          } > stage/.deploy.env
          chmod 600 stage/.env stage/.deploy.env

      # Una sola invocación de ssh: mkdir + desempaquetado del bundle completo
      # (compose + .env + script) sobre el socket maestro ya abierto.
      - name: Transfer bundle (single SSH pipeline)
        run: |
          set -euo pipefail
          # shellcheck disable=SC2029
          tar -C stage -cf - . \
            | ssh deploy-target "mkdir -p ~/$DEPLOY_DIR && tar -xf - -C ~/$DEPLOY_DIR"

      - name: Run remote deployment
        run: |
          set -euo pipefail
          # shellcheck disable=SC2029
          ssh deploy-target "DEPLOY_DIR=\$HOME/$DEPLOY_DIR bash ~/$DEPLOY_DIR/remote-deploy.sh"

      - name: Close master SSH connection
        if: always()
        run: ssh -O exit deploy-target 2>/dev/null || true

      - name: Tear down WireGuard tunnel
        if: always()
        run: sudo wg-quick down wg0 2>/dev/null || true
