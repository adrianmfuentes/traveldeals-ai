name: Build & Push Docker Images

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-app:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout traveldeals-ai
        uses: actions/checkout@v4
        with:
          path: traveldeals-ai

      - name: Checkout platform-core
        uses: actions/checkout@v4
        with:
          repository: adrianmfuentes/platform-core
          path: platform-core
          token: ${{ secrets.PLATFORM_CORE_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: traveldeals-ai/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/app:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

  build-worker:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout traveldeals-ai
        uses: actions/checkout@v4
        with:
          path: traveldeals-ai

      - name: Checkout platform-core
        uses: actions/checkout@v4
        with:
          repository: adrianmfuentes/platform-core
          path: platform-core
          token: ${{ secrets.PLATFORM_CORE_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: traveldeals-ai/Dockerfile.worker
          push: true
          tags: ghcr.io/${{ github.repository }}/worker:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
