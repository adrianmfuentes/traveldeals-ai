name: Build & Push Docker Images

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_APP: ghcr.io/${{ github.repository }}/app
  IMAGE_WORKER: ghcr.io/${{ github.repository }}/worker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout traveldeals-ai
        uses: actions/checkout@v4
        with:
          path: traveldeals-ai

      - name: Checkout platform-core
        uses: actions/checkout@v4
        with:
          repository: adrianmfuentes/platform-core
          path: platform-core
          token: ${{ secrets.PLATFORM_CORE_TOKEN }}

      - name: Set up QEMU (ARM64 support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: traveldeals-ai/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_APP }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: traveldeals-ai/Dockerfile.worker
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_WORKER }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
